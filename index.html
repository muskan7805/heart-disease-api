<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart Disease Predictor</title>
<style>body{font-family:Arial;max-width:600px;margin:auto;padding:20px}input{width:100%;padding:8px;margin:5px 0}button{background:#ff4757;color:white;padding:12px;width:100%;border:none;font-size:18px;border-radius:8px} #result{margin-top:15px;padding:10px;border-radius:8px}</style>
</head><body>
<h2>Heart Disease Risk Prediction</h2>
<p>Model: XGBoost (Render: ew83)</p>
Age: <input id="age" value="63" type="number">
Sex (1=M,0=F): <input id="sex" value="1" type="number">
CP (0-3): <input id="cp" value="3" type="number">
BP: <input id="trestbps" value="145" type="number">
Chol: <input id="chol" value="233" type="number">
<button onclick="predict()">Predict Risk</button>
<div id="result">Result yaha ayega</div>
<script>
const API = "https://heart-disease-api-ew83.onrender.com";
async function predict(){
  let r = document.getElementById('result');
  r.innerHTML = "⏳ API ko jaga rahe hain... (Free plan pe 50 sec lagta hai) Please wait...";
  let data = {
    age: +age.value, sex: +sex.value, cp: +cp.value, trestbps: +trestbps.value,
    chol: +chol.value, fbs:0, restecg:0, thalach:150, exang:0, oldpeak:2.3, slope:0, ca:0, thal:1
  };
  try{
    let res = await fetch(API+"/predict", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    let j = await res.json();
    r.innerHTML = "<b>Result:</b> Risk = " + j.risk_probability + "<br><pre>"+JSON.stringify(j,null,2)+"</pre>";
  }catch(e){
    r.innerHTML = "⚠️ API abhi so gaya tha, 55 sec me auto-retry ho raha hai... Please wait, page band mat karo.";
    setTimeout(predict, 55000);
  }
}
</script></body></html>
